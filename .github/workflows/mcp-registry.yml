# Publishes server.json to the official MCP registry after a release reached npm, or by hand. The name io.github.paironce/cli
# needs a credential that speaks for the paironce organization: this repository's GitHub OIDC identity; no secret is stored.
name: Publish to the MCP registry
on:
  workflow_run:
    workflows: ["Publish to npm"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher 1.8.7
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz
          echo "00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      # A new version takes npm some minutes to serve everywhere, and the registry checks the package there.
      - name: Publish
        run: |
          for attempt in 1 2 3 4 5 6; do
            ./mcp-publisher publish && exit 0
            sleep 120
          done
          exit 1
