# How fast each relay path carries a file from a machine with a clean network. By hand only.
name: Relay path speed
on:
  workflow_dispatch:
    inputs:
      paths:
        description: Relay paths to try (udp, tcp, tls), comma separated; a:b when the two ends differ
        default: "udp,tcp,tls"
      sizes:
        description: File sizes in MiB, within the free allowance
        default: "1,16"
permissions:
  contents: read
jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - run: PATHS=${{ inputs.paths }} SIZES=${{ inputs.sizes }} node .github/tools/relay-path-speed.mjs
