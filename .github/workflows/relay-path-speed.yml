# How fast each relay path carries a file from a machine with a clean network, with added delay if asked. By hand only.
name: Relay path speed
on:
  workflow_dispatch:
    inputs:
      paths:
        description: Relay paths to try (udp, tcp, tls), comma separated; a:b when the two ends differ
        default: "udp,tcp,tls"
      sizes:
        description: File sizes in MiB, within the free allowance
        default: "1,16"
      delays:
        description: Milliseconds added to each packet leaving the machine, space separated
        default: "0"
      paces:
        description: Sender limits to try in KiB per second, space separated; 0 for none
        default: "0"
permissions:
  contents: read
jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - env:
          PATHS: ${{ inputs.paths }}
          SIZES: ${{ inputs.sizes }}
          DELAYS: ${{ inputs.delays }}
          PACES: ${{ inputs.paces }}
        run: |
          device=$(ip route | awk '/default/{print $5; exit}')
          for delay in $DELAYS; do
            echo "delay $delay ms"
            sudo tc qdisc del dev "$device" root 2>/dev/null || true
            if [ "$delay" != "0" ]; then sudo tc qdisc add dev "$device" root netem delay "${delay}ms"; fi
            for pace in $PACES; do
              PACE=$pace LIMIT_SECONDS=120 node .github/tools/relay-path-speed.mjs
            done
          done
