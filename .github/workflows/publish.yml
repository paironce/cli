# Publishes paironce to npm when a GitHub release is published in paironce/cli, through npm trusted publishing (OIDC):
# no npm token is stored anywhere, and npm attaches provenance that ties the package to this repository and commit.
# The package is the committed dist/paironce.mjs, built from the PairOnce monorepo (see SOURCE.md); nothing is rebuilt here.
name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.6.2
      - name: The release tag names the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # The published file runs with the dependencies a user gets (node-datachannel, zod).
      - run: npm install --no-save --no-package-lock --ignore-scripts
      - run: node dist/paironce.mjs --version
      - run: npm publish --access public
