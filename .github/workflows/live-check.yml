# A manual check that the published CLI connects from a cloud machine to a browser on paironce.com: it pairs with the
# code the browser shows, then sends a file and a message to it. "no-udp" drops all outbound UDP except DNS, the way
# many sandboxes and containers do, so only TCP/TLS paths (the relay on 443) are left.
name: Live check from a cloud machine
on:
  workflow_dispatch:
    inputs:
      code:
        description: Six-digit code shown by the browser
        required: true
      network:
        description: normal or no-udp
        default: normal
      package:
        description: What to install (paironce@latest, or github:paironce/cli#next for a candidate)
        default: paironce@latest
      large_mib:
        description: Instead of the small file and message, send a random file of this many MiB over the relay (0 for none)
        default: "0"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAIRONCE_HOME: /tmp/paironce-check
      PAIRONCE_DEBUG: "1"
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g "${{ inputs.package }}" && paironce --version
      - name: Block outbound UDP except DNS
        if: inputs.network == 'no-udp'
        run: |
          sudo iptables -A OUTPUT -p udp --dport 53 -j ACCEPT
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -p udp -j DROP
          sudo ip6tables -A OUTPUT -p udp --dport 53 -j ACCEPT
          sudo ip6tables -A OUTPUT -o lo -j ACCEPT
          sudo ip6tables -A OUTPUT -p udp -j DROP
      - run: script -qec 'paironce pair "${{ inputs.code }}"' /dev/null  # joining a code needs a terminal
      - run: printf 'Sent from a GitHub Actions runner (%s network) at %s\n' "${{ inputs.network }}" "$(date -u)" > runner-check.txt
        if: inputs.large_mib == '0'
      - run: paironce send runner-check.txt
        if: inputs.large_mib == '0'
      - run: paironce text "runner says hello (${{ inputs.network }})"
        if: inputs.large_mib == '0'
      - name: Send a large file over the relay
        if: inputs.large_mib != '0'
        env:
          PAIRONCE_FORCE_RELAY: "1"
        run: |
          head -c $((${{ inputs.large_mib }} * 1048576)) /dev/urandom > large-check.bin
          date -u
          time paironce send large-check.bin
          date -u
